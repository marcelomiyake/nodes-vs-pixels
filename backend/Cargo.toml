[package]
name = "backend"
description = "gRPC and gRPC-web sign-up service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
form-core.workspace = true
prost = "0.14.4"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-web = "0.14.6"
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }

[lints]
workspace = true
