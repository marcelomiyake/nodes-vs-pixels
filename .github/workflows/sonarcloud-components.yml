name: SonarCloud component analysis
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: sonar-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 12.6.0
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
    - name: Prepare analysis inputs
      id: prepare
      run: |-
        pnpm install --frozen-lockfile
        cargo install cargo-llvm-cov --version 0.9.1 --locked
        make coverage
    - name: Analyze Repository aggregate
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=.sonar/repository.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: Analyze backend
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=backend/sonar-project.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: Analyze web-react
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=web-react/sonar-project.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: Analyze web-wasm
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=web-wasm/sonar-project.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: Analyze form-core
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: -Dproject.settings=.sonar/form-core.properties
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
