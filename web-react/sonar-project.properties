# SonarQube Cloud: the React frontend with the SEO step it shares, and the
# end-to-end tests of both frontends. Run from the repository root (`make sonar`).
sonar.organization=marcelomiyake
sonar.projectKey=marcelomiyake_nodes-vs-pixels_web-react
sonar.projectName=nodes-vs-pixels-web-react
sonar.sourceEncoding=UTF-8
sonar.sources=web-react/src,web-react/scripts,web-react/index.html,web-react/Dockerfile,web-react/vite.config.ts,web-react/eslint.config.js,seo
sonar.tests=web-react/src,web-react/scripts,seo,e2e
sonar.exclusions=web-react/src/gen/**,**/*.test.*,web-react/src/test-setup.ts,seo/coverage/**
sonar.test.inclusions=**/*.test.*,web-react/src/test-setup.ts,e2e/**
sonar.test.exclusions=web-react/src/gen/**,**/node_modules/**,e2e/test-results/**
sonar.javascript.lcov.reportPaths=web-react/coverage/lcov.info,seo/coverage/lcov.info
