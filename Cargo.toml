[workspace]
resolver = "3"
members = ["backend", "crates/form-core"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.90"

[workspace.dependencies]
form-core = { path = "crates/form-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
